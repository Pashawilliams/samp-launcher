name: SA-MP Launcher — статус и публикация

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # GitHub запускает примерно раз в 5–15 минут
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Опрос SA-MP серверов
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/query.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
